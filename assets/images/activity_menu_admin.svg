<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 930" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', Times, serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .lane-title { font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .text-node { font-family: 'Times New Roman', Times, serif; font-size: 12px; fill: #000000; text-anchor: middle; }
      .label-edge { font-family: 'Times New Roman', Times, serif; font-size: 11px; fill: #000000; text-anchor: middle; font-style: italic; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .rect-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; rx: 8; ry: 8; }
      .diamond-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .start-node { fill: #000000; stroke: #000000; stroke-width: 1.5; }
      .end-node-outer { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .end-node-inner { fill: #000000; }
      .border-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .arrow { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Main Background -->
  <rect x="10" y="10" width="720" height="910" fill="#ffffff" stroke="#000000" stroke-width="2" rx="10" ry="10" />

  <!-- Pool Header -->
  <rect x="10" y="10" width="720" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="2" rx="10" ry="10" />
  <rect x="10" y="30" width="720" height="20" fill="#f0f0f0" />
  <line x1="10" y1="50" x2="730" y2="50" stroke="#000000" stroke-width="2" />
  <text x="370" y="34" class="title">Activity Diagram: Mengelola Menu Makanan &amp; Minuman</text>

  <!-- Swimlane Divider -->
  <line x1="330" y1="50" x2="330" y2="920" class="border-line" />

  <!-- Lane Headers -->
  <rect x="10" y="50" width="320" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <rect x="330" y="50" width="400" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <text x="170" y="70" class="lane-title">Admin (Aktor)</text>
  <text x="530" y="70" class="lane-title">Sistem (Aplikasi)</text>

  <!-- ================= ADMIN LANE ELEMENTS ================= -->
  <!-- Start -->
  <circle cx="170" cy="110" r="10" class="start-node" />
  
  <!-- Action: Akses Kelola Menu -->
  <rect x="80" y="150" width="180" height="50" class="rect-node" />
  <text x="170" y="174" class="text-node">Mengakses Halaman Kelola</text>
  <text x="170" y="188" class="text-node">Menu (kelola_menu.php)</text>

  <!-- Decision: Memilih Aksi -->
  <polygon points="170,230 240,270 170,310 100,270" class="diamond-node" />
  <text x="170" y="274" class="text-node" style="font-size: 11px;">Memilih Aksi?</text>

  <!-- Action: Isi Form (Path A) -->
  <rect x="30" y="360" width="130" height="50" class="rect-node" />
  <text x="95" y="384" class="text-node">Mengisi Form Menu</text>
  <text x="95" y="398" class="text-node">&amp; Unggah Foto</text>

  <!-- Action: Simpan (Path A) -->
  <rect x="30" y="440" width="130" height="50" class="rect-node" />
  <text x="95" y="469" class="text-node">Menekan Tombol Simpan</text>

  <!-- Action: Hapus (Path B) -->
  <rect x="180" y="360" width="130" height="50" class="rect-node" />
  <text x="245" y="384" class="text-node">Mengeklik Tombol Hapus</text>
  <text x="245" y="398" class="text-node">&amp; Konfirmasi</text>

  <!-- End State (Path C: Selesai) -->
  <circle cx="170" cy="850" r="10" class="end-node-outer" />
  <circle cx="170" cy="850" r="6" class="end-node-inner" />

  <!-- ================= SISTEM LANE ELEMENTS ================= -->
  <!-- Action: Tampilkan Menu -->
  <rect x="440" y="150" width="180" height="50" class="rect-node" />
  <text x="530" y="179" class="text-node">Menampilkan Daftar Menu</text>

  <!-- Decision: File Valid? (Path A) -->
  <polygon points="430,425 505,465 430,505 355,465" class="diamond-node" />
  <text x="430" y="461" class="text-node" style="font-size: 10px;">Apakah File Valid?</text>
  <text x="430" y="473" class="text-node" style="font-size: 9px;">Format &amp; Ukuran &lt; 2MB</text>

  <!-- Action: Error File (Path A) -->
  <rect x="550" y="440" width="150" height="50" class="rect-node" />
  <text x="625" y="469" class="text-node">Pesan Kesalahan File</text>

  <!-- Action: Update DB (Path A) -->
  <rect x="340" y="550" width="180" height="50" class="rect-node" />
  <text x="430" y="574" class="text-node">Mengunggah Foto &amp; Update</text>
  <text x="430" y="588" class="text-node">Record Tabel menu</text>

  <!-- Action: Hapus DB & File (Path B) -->
  <rect x="540" y="550" width="170" height="50" class="rect-node" />
  <text x="625" y="574" class="text-node">Menghapus Foto Fisik &amp;</text>
  <text x="625" y="588" class="text-node">Record Tabel menu</text>

  <!-- Action: Notif Sukses -->
  <rect x="440" y="660" width="180" height="50" class="rect-node" />
  <text x="530" y="689" class="text-node">Menampilkan Notifikasi Sukses</text>

  <!-- ================= EDGES & CONNECTIONS ================= -->
  <!-- Start -> Akses -->
  <line x1="170" y1="120" x2="170" y2="150" class="line" marker-end="url(#arrow)" />

  <!-- Akses -> Tampil (Cross Lane) -->
  <line x1="260" y1="175" x2="440" y2="175" class="line" marker-end="url(#arrow)" />

  <!-- Tampil -> Aksi? (Cross Lane) -->
  <path d="M 440 185 L 340 185 L 340 250 L 225 250" class="line" marker-end="url(#arrow)" />

  <!-- Aksi? -> Tambah/Edit -->
  <path d="M 135 270 L 95 270 L 95 360" class="line" marker-end="url(#arrow)" />
  <text x="95" y="325" class="label-edge">Tambah / Edit</text>

  <!-- Isi -> Simpan -->
  <line x1="95" y1="410" x2="95" y2="440" class="line" marker-end="url(#arrow)" />

  <!-- Simpan -> File? (Cross Lane) -->
  <path d="M 160 465 L 355 465" class="line" marker-end="url(#arrow)" />

  <!-- File? -> Error [Tidak] -->
  <line x1="505" y1="465" x2="550" y2="465" class="line" marker-end="url(#arrow)" />
  <text x="525" y="455" class="label-edge">Tidak</text>

  <!-- Error -> Isi (Loop back) (Cross Lane) -->
  <path d="M 625 440 L 625 340 L 95 340 L 95 360" class="line" marker-end="url(#arrow)" />

  <!-- File? -> Update DB [Ya] -->
  <line x1="430" y1="505" x2="430" y2="550" class="line" marker-end="url(#arrow)" />
  <text x="445" y="525" class="label-edge">Ya</text>

  <!-- Update DB -> Notif -->
  <path d="M 430 600 L 430 635 L 530 635 L 530 660" class="line" marker-end="url(#arrow)" />

  <!-- Aksi? -> Hapus -->
  <path d="M 205 270 L 245 270 L 245 360" class="line" marker-end="url(#arrow)" />
  <text x="245" y="325" class="label-edge">Hapus</text>

  <!-- Hapus -> Delete DB (Cross Lane) -->
  <path d="M 245 410 L 245 520 L 625 520 L 625 550" class="line" marker-end="url(#arrow)" />

  <!-- Delete DB -> Notif -->
  <path d="M 625 600 L 625 635 L 530 635 L 530 660" class="line" marker-end="url(#arrow)" />

  <!-- Notif -> Tampil (Loop back to display list) -->
  <path d="M 530 710 L 530 735 L 720 735 L 720 175 L 620 175" class="line" marker-end="url(#arrow)" />

  <!-- Aksi? -> Selesai -->
  <line x1="170" y1="310" x2="170" y2="840" class="line" marker-end="url(#arrow)" />
  <text x="190" y="525" class="label-edge">Selesai</text>

</svg>