<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="usecaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan 500 -->
    </linearGradient>
    <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" /> <!-- Pink 500 -->
      <stop offset="100%" stop-color="#8b5cf6" /> <!-- Violet 500 -->
    </linearGradient>
    <linearGradient id="logoutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" /> <!-- Rose 500 -->
      <stop offset="100%" stop-color="#fb7185" /> <!-- Rose 400 -->
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Marker for arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="includeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#f472b6" />
    </marker>
  </defs>

  <!-- Title of Diagram -->
  <text x="550" y="45" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    USE CASE DIAGRAM: SISTEM PEMESANAN AL-BAROKAH
  </text>
  
  <!-- System Boundary -->
  <rect x="230" y="80" width="640" height="730" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#dropShadow)"/>
  <text x="550" y="115" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    SYSTEM BOUNDARY: AYAM PENYET AL-BAROKAH
  </text>

  <!-- ================= ACTORS ================= -->
  
  <!-- Actor 1: Pelanggan (Left) -->
  <g transform="translate(100, 390)" filter="url(#dropShadow)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Body -->
    <line x1="0" y1="-24" x2="0" y2="25" stroke="#38bdf8" stroke-width="3"/>
    <!-- Arms -->
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#38bdf8" stroke-width="3"/>
    <!-- Legs -->
    <line x1="0" y1="25" x2="-18" y2="65" stroke="#38bdf8" stroke-width="3"/>
    <line x1="0" y1="25" x2="18" y2="65" stroke="#38bdf8" stroke-width="3"/>
    <!-- Label -->
    <text x="0" y="95" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Pelanggan</text>
    <text x="0" y="112" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">(Customer/Guest)</text>
  </g>

  <!-- Actor 2: Admin (Right) -->
  <g transform="translate(1000, 390)" filter="url(#dropShadow)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="16" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <!-- Body -->
    <line x1="0" y1="-24" x2="0" y2="25" stroke="#f43f5e" stroke-width="3"/>
    <!-- Arms -->
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#f43f5e" stroke-width="3"/>
    <!-- Legs -->
    <line x1="0" y1="25" x2="-18" y2="65" stroke="#f43f5e" stroke-width="3"/>
    <line x1="0" y1="25" x2="18" y2="65" stroke="#f43f5e" stroke-width="3"/>
    <!-- Label -->
    <text x="0" y="95" font-size="16" font-weight="700" fill="#f43f5e" text-anchor="middle">Admin</text>
    <text x="0" y="112" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">(Administrator)</text>
  </g>

  <!-- ================= USE CASES ================= -->
  
  <!-- Use Case: Login Admin -->
  <g transform="translate(550, 170)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="100" ry="28" fill="url(#loginGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="0" y="5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Login Admin</text>
  </g>

  <!-- Use Case: Lihat Katalog Menu -->
  <g transform="translate(380, 220)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Lihat Katalog Menu</text>
  </g>

  <!-- Use Case: Kelola Keranjang Belanja -->
  <g transform="translate(380, 310)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Kelola Keranjang</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Belanja</text>
  </g>

  <!-- Use Case: Melakukan Checkout Pesanan -->
  <g transform="translate(380, 410)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Melakukan Checkout</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Pesanan</text>
  </g>

  <!-- Use Case: Mengunggah Bukti Pembayaran -->
  <g transform="translate(380, 510)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Mengunggah Bukti</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Pembayaran</text>
  </g>

  <!-- Use Case: Memantau Status Pesanan -->
  <g transform="translate(380, 610)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Memantau Status</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Pesanan</text>
  </g>

  <!-- Use Case: Melihat Dashboard & Statistik -->
  <g transform="translate(720, 270)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Melihat Dashboard</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">&amp; Statistik</text>
  </g>

  <!-- Use Case: Mengelola Menu (CRUD) -->
  <g transform="translate(720, 390)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Mengelola Menu</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Makanan &amp; Minuman</text>
  </g>

  <!-- Use Case: Mengelola Pesanan Pelanggan -->
  <g transform="translate(720, 510)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Mengelola Pesanan</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">&amp; Verifikasi Bayar</text>
  </g>

  <!-- Use Case: Melihat Laporan Penjualan -->
  <g transform="translate(720, 630)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="110" ry="28" fill="url(#usecaseGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="0" y="-3" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Melihat Laporan</text>
    <text x="0" y="13" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">Penjualan</text>
  </g>

  <!-- Use Case: Logout -->
  <g transform="translate(550, 720)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="100" ry="28" fill="url(#logoutGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="0" y="5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Logout Admin</text>
  </g>


  <!-- ================= CONNECTIONS ================= -->
  
  <!-- Pelanggan to Use Cases -->
  <path d="M 125 360 L 275 228" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
  <path d="M 125 375 L 272 313" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
  <path d="M 125 390 L 270 410" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
  <path d="M 125 405 L 272 505" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
  <path d="M 125 420 L 275 600" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>

  <!-- Admin to Use Cases -->
  <path d="M 975 365 L 650 170" stroke="#f43f5e" stroke-width="1.5" opacity="0.85"/>
  <path d="M 975 375 L 825 285" stroke="#f43f5e" stroke-width="1.5" opacity="0.85"/>
  <path d="M 975 390 L 830 390" stroke="#f43f5e" stroke-width="1.5" opacity="0.85"/>
  <path d="M 975 405 L 830 505" stroke="#f43f5e" stroke-width="1.5" opacity="0.85"/>
  <path d="M 975 415 L 825 615" stroke="#f43f5e" stroke-width="1.5" opacity="0.85"/>
  <path d="M 975 425 L 650 715" stroke="#f43f5e" stroke-width="1.5" opacity="0.85"/>


  <!-- ================= INCLUDES (Dashed lines to Login Admin) ================= -->
  
  <!-- Dashboard to Login -->
  <path d="M 660 235 L 610 205" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#includeArrow)"/>
  <text x="635" y="210" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" transform="rotate(-30, 635, 210)">&lt;&lt;include&gt;&gt;</text>

  <!-- Kelola Menu to Login -->
  <path d="M 640 330 L 585 200" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#includeArrow)"/>
  <text x="612" y="265" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" transform="rotate(-65, 612, 265)">&lt;&lt;include&gt;&gt;</text>

  <!-- Kelola Pesanan to Login -->
  <path d="M 630 450 L 575 200" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#includeArrow)"/>
  <text x="602" y="325" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" transform="rotate(-77, 602, 325)">&lt;&lt;include&gt;&gt;</text>

  <!-- Laporan to Login -->
  <path d="M 630 570 L 565 200" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#includeArrow)"/>
  <text x="597" y="385" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" transform="rotate(-82, 597, 385)">&lt;&lt;include&gt;&gt;</text>

</svg>
