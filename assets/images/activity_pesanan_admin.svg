<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', Times, serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .lane-title { font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .text-node { font-family: 'Times New Roman', Times, serif; font-size: 12px; fill: #000000; text-anchor: middle; }
      .label-edge { font-family: 'Times New Roman', Times, serif; font-size: 11px; fill: #000000; text-anchor: middle; font-style: italic; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .rect-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; rx: 8; ry: 8; }
      .diamond-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .start-node { fill: #000000; stroke: #000000; stroke-width: 1.5; }
      .end-node-outer { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .end-node-inner { fill: #000000; }
      .border-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .arrow { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Main Background -->
  <rect x="10" y="10" width="720" height="630" fill="#ffffff" stroke="#000000" stroke-width="2" rx="10" ry="10" />

  <!-- Pool Header -->
  <rect x="10" y="10" width="720" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="2" rx="10" ry="10" />
  <rect x="10" y="30" width="720" height="20" fill="#f0f0f0" />
  <line x1="10" y1="50" x2="730" y2="50" stroke="#000000" stroke-width="2" />
  <text x="370" y="34" class="title">Activity Diagram: Mengelola Pesanan &amp; Verifikasi Pembayaran (Sederhana)</text>

  <!-- Swimlane Divider -->
  <line x1="330" y1="50" x2="330" y2="640" class="border-line" />

  <!-- Lane Headers -->
  <rect x="10" y="50" width="320" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <rect x="330" y="50" width="400" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <text x="170" y="70" class="lane-title">Admin (Aktor)</text>
  <text x="530" y="70" class="lane-title">Sistem (Aplikasi)</text>

  <!-- ================= ADMIN LANE ELEMENTS ================= -->
  <circle cx="170" cy="110" r="10" class="start-node" />
  
  <rect x="80" y="150" width="180" height="50" class="rect-node" />
  <text x="170" y="174" class="text-node">Mengakses Halaman Kelola</text>
  <text x="170" y="188" class="text-node">Pesanan (kelola_pesanan.php)</text>

  <rect x="80" y="230" width="180" height="50" class="rect-node" />
  <text x="170" y="254" class="text-node">Memilih Pesanan &amp; Memeriksa</text>
  <text x="170" y="268" class="text-node">Bukti Transfer Pelanggan</text>

  <!-- Decision -->
  <polygon points="170,310 240,350 170,390 100,350" class="diamond-node" />
  <text x="170" y="354" class="text-node" style="font-size: 11px;">Apakah Bukti Valid?</text>

  <!-- Action: Set Lunas (Ya) -->
  <rect x="20" y="420" width="140" height="50" class="rect-node" />
  <text x="90" y="444" class="text-node">Set Status: Lunas</text>
  <text x="90" y="458" class="text-node">&amp; Status Pesanan: Diproses</text>

  <!-- Action: Set Batal (Tidak) -->
  <rect x="180" y="420" width="140" height="50" class="rect-node" />
  <text x="250" y="444" class="text-node">Set Status: Ditolak</text>
  <text x="250" y="458" class="text-node">&amp; Status Pesanan: Batal</text>

  <!-- Action: Simpan -->
  <rect x="80" y="500" width="180" height="50" class="rect-node" />
  <text x="170" y="529" class="text-node">Menekan Tombol Simpan</text>

  <!-- ================= SISTEM LANE ELEMENTS ================= -->
  <rect x="440" y="150" width="180" height="50" class="rect-node" />
  <text x="530" y="174" class="text-node">Menampilkan Daftar Pesanan</text>
  <text x="530" y="188" class="text-node">&amp; Rincian Transaksi</text>

  <rect x="440" y="500" width="180" height="50" class="rect-node" />
  <text x="530" y="524" class="text-node">Memperbarui Data di Database</text>
  <text x="530" y="538" class="text-node">&amp; Menampilkan Pesan Sukses</text>

  <circle cx="530" cy="590" r="10" class="end-node-outer" />
  <circle cx="530" cy="590" r="6" class="end-node-inner" />

  <!-- ================= EDGES & CONNECTIONS ================= -->
  <!-- Start -> Akses -->
  <line x1="170" y1="120" x2="170" y2="150" class="line" marker-end="url(#arrow)" />

  <!-- Akses -> Tampil (Cross Lane) -->
  <line x1="260" y1="175" x2="440" y2="175" class="line" marker-end="url(#arrow)" />

  <!-- Tampil -> Pilih (Cross Lane) -->
  <path d="M 530 200 L 530 215 L 170 215 L 170 230" class="line" marker-end="url(#arrow)" />

  <!-- Pilih -> Valid? -->
  <line x1="170" y1="280" x2="170" y2="310" class="line" marker-end="url(#arrow)" />

  <!-- Valid? -> Set Lunas [Ya] -->
  <path d="M 135 350 L 90 350 L 90 420" class="line" marker-end="url(#arrow)" />
  <text x="110" y="340" class="label-edge">Ya</text>

  <!-- Decision -> Set Batal [Tidak] -->
  <path d="M 205 350 L 250 350 L 250 420" class="line" marker-end="url(#arrow)" />
  <text x="230" y="340" class="label-edge">Tidak</text>

  <!-- Set Lunas -> Simpan -->
  <path d="M 90 470 L 90 485 L 170 485 L 170 500" class="line" marker-end="url(#arrow)" />

  <!-- Set Batal -> Simpan -->
  <path d="M 250 470 L 250 485 L 170 485 L 170 500" class="line" marker-end="url(#arrow)" />

  <!-- Simpan -> Update (Cross Lane) -->
  <line x1="260" y1="525" x2="440" y2="525" class="line" marker-end="url(#arrow)" />

  <!-- Update -> End -->
  <line x1="530" y1="550" x2="530" y2="580" class="line" marker-end="url(#arrow)" />

</svg>