<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 600" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', Times, serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .lane-title { font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .text-node { font-family: 'Times New Roman', Times, serif; font-size: 12px; fill: #000000; text-anchor: middle; }
      .label-edge { font-family: 'Times New Roman', Times, serif; font-size: 11px; fill: #000000; text-anchor: middle; font-style: italic; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .rect-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; rx: 8; ry: 8; }
      .diamond-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .start-node { fill: #000000; stroke: #000000; stroke-width: 1.5; }
      .end-node-outer { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .end-node-inner { fill: #000000; }
      .border-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .arrow { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Main Background -->
  <rect x="10" y="10" width="720" height="580" fill="#ffffff" stroke="#000000" stroke-width="2" rx="10" ry="10" />

  <!-- Pool Header -->
  <rect x="10" y="10" width="720" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="2" rx="10" ry="10" />
  <rect x="10" y="30" width="720" height="20" fill="#f0f0f0" />
  <line x1="10" y1="50" x2="730" y2="50" stroke="#000000" stroke-width="2" />
  <text x="370" y="34" class="title">Activity Diagram: Memantau Status Pesanan (Pelanggan)</text>

  <!-- Swimlane Divider -->
  <line x1="330" y1="50" x2="330" y2="580" class="border-line" />

  <!-- Lane Headers -->
  <rect x="10" y="50" width="320" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <rect x="330" y="50" width="400" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <text x="170" y="70" class="lane-title">Pelanggan (Aktor)</text>
  <text x="530" y="70" class="lane-title">Sistem (Aplikasi)</text>

  <!-- ================= PELANGGAN LANE ELEMENTS ================= -->
  <circle cx="170" cy="100" r="10" class="start-node" />
  
  <rect x="80" y="140" width="180" height="50" class="rect-node" />
  <text x="170" y="164" class="text-node">Mengakses Halaman Detail Pesanan</text>
  <text x="170" y="178" class="text-node" style="font-size: 8.5px;">(fitur_pemesanan/konfirmasi-bayar.php?kode=ALB-YYMMDD-HHMMSS)</text>

  <rect x="80" y="430" width="180" height="50" class="rect-node" />
  <text x="170" y="459" class="text-node">Membaca &amp; Memantau Status Pesanan</text>

  <circle cx="170" cy="530" r="10" class="end-node-outer" />
  <circle cx="170" cy="530" r="6" class="end-node-inner" />

  <!-- ================= SISTEM LANE ELEMENTS ================= -->
  <rect x="440" y="140" width="180" height="50" class="rect-node" />
  <text x="530" y="164" class="text-node">Membaca Parameter</text>
  <text x="530" y="178" class="text-node">Kode Pesanan dari URL</text>

  <rect x="440" y="220" width="180" height="50" class="rect-node" />
  <text x="530" y="249" class="text-node">Query Database Tabel pesanan</text>

  <!-- Decision: Ditemukan? -->
  <polygon points="530,300 600,340 530,380 460,340" class="diamond-node" />
  <text x="530" y="344" class="text-node" style="font-size: 11px;">Apakah Ditemukan?</text>

  <!-- Action: Tampilkan Status -->
  <rect x="350" y="420" width="180" height="50" class="rect-node" />
  <text x="440" y="444" class="text-node">Tampilkan Detail Pesanan Beserta</text>
  <text x="440" y="458" class="text-node" style="font-size: 9.5px;">Status Pembayaran &amp; Status Pesanan Terbaru</text>

  <!-- Action: Error DB -->
  <rect x="550" y="420" width="160" height="50" class="rect-node" />
  <text x="630" y="444" class="text-node">Tampilkan Pesan Kesalahan:</text>
  <text x="630" y="458" class="text-node">Pesanan Tidak Ditemukan</text>

  <!-- End State: Error -->
  <circle cx="630" cy="510" r="10" class="end-node-outer" />
  <circle cx="630" cy="510" r="6" class="end-node-inner" />

  <!-- ================= EDGES & CONNECTIONS ================= -->
  <!-- Start -> Akses -->
  <line x1="170" y1="110" x2="170" y2="140" class="line" marker-end="url(#arrow)" />

  <!-- Akses -> Baca URL (Cross Lane) -->
  <line x1="260" y1="165" x2="440" y2="165" class="line" marker-end="url(#arrow)" />

  <!-- Baca URL -> Query -->
  <line x1="530" y1="190" x2="530" y2="220" class="line" marker-end="url(#arrow)" />

  <!-- Query -> Decision -->
  <line x1="530" y1="270" x2="530" y2="300" class="line" marker-end="url(#arrow)" />

  <!-- Decision -> Error [Tidak] -->
  <path d="M 600 340 L 630 340 L 630 420" class="line" marker-end="url(#arrow)" />
  <text x="615" y="330" class="label-edge">Tidak</text>

  <!-- Error -> End Error -->
  <line x1="630" y1="470" x2="630" y2="500" class="line" marker-end="url(#arrow)" />

  <!-- Decision -> Tampilkan [Ya] -->
  <path d="M 460 340 L 440 340 L 440 420" class="line" marker-end="url(#arrow)" />
  <text x="445" y="330" class="label-edge">Ya</text>

  <!-- Tampilkan -> Membaca (Cross Lane) -->
  <path d="M 350 445 L 295 445 L 295 455 L 260 455" class="line" marker-end="url(#arrow)" />

  <!-- Membaca -> End -->
  <line x1="170" y1="480" x2="170" y2="520" class="line" marker-end="url(#arrow)" />

</svg>