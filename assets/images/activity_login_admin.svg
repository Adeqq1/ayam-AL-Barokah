<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 850" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', Times, serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .lane-title { font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .text-node { font-family: 'Times New Roman', Times, serif; font-size: 12px; fill: #000000; text-anchor: middle; }
      .label-edge { font-family: 'Times New Roman', Times, serif; font-size: 11px; fill: #000000; text-anchor: middle; font-style: italic; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .rect-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; rx: 8; ry: 8; }
      .diamond-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .start-node { fill: #000000; stroke: #000000; stroke-width: 1.5; }
      .end-node-outer { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .end-node-inner { fill: #000000; }
      .border-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .arrow { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Main Background -->
  <rect x="10" y="10" width="720" height="830" fill="#ffffff" stroke="#000000" stroke-width="2" rx="10" ry="10" />

  <!-- Pool Header -->
  <rect x="10" y="10" width="720" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="2" rx="10" ry="10" />
  <rect x="10" y="30" width="720" height="20" fill="#f0f0f0" />
  <line x1="10" y1="50" x2="730" y2="50" stroke="#000000" stroke-width="2" />
  <text x="370" y="34" class="title">Activity Diagram: Login Admin</text>

  <!-- Swimlane Divider -->
  <line x1="330" y1="50" x2="330" y2="840" class="border-line" />

  <!-- Lane Headers -->
  <rect x="10" y="50" width="320" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <rect x="330" y="50" width="400" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <text x="170" y="70" class="lane-title">Admin (Aktor)</text>
  <text x="530" y="70" class="lane-title">Sistem (Aplikasi)</text>

  <!-- ================= ADMIN LANE ELEMENTS ================= -->
  <circle cx="170" cy="110" r="10" class="start-node" />
  
  <rect x="80" y="150" width="180" height="50" class="rect-node" />
  <text x="170" y="179" class="text-node">Mengakses halaman login.php</text>

  <rect x="80" y="310" width="180" height="50" class="rect-node" />
  <text x="170" y="334" class="text-node">Memasukkan Username</text>
  <text x="170" y="348" class="text-node">&amp; Password</text>

  <rect x="80" y="390" width="180" height="50" class="rect-node" />
  <text x="170" y="419" class="text-node">Menekan Tombol Login</text>

  <!-- ================= SISTEM LANE ELEMENTS ================= -->
  <rect x="440" y="230" width="180" height="50" class="rect-node" />
  <text x="530" y="259" class="text-node">Menampilkan Form Login</text>

  <rect x="440" y="470" width="180" height="50" class="rect-node" />
  <text x="530" y="494" class="text-node">Melakukan Sanitasi Input</text>
  <text x="530" y="508" class="text-node">&amp; Validasi Kredensial</text>

  <!-- Decision -->
  <polygon points="530,550 610,590 530,630 450,590" class="diamond-node" />
  <text x="530" y="586" class="text-node" style="font-size: 11px;">Apakah</text>
  <text x="530" y="600" class="text-node" style="font-size: 11px;">Kredensial Valid?</text>

  <!-- Error display -->
  <rect x="440" y="390" width="180" height="50" class="rect-node" />
  <text x="530" y="419" class="text-node">Menampilkan Pesan Kesalahan</text>

  <!-- Session creation -->
  <rect x="440" y="660" width="180" height="50" class="rect-node" />
  <text x="530" y="689" class="text-node">Menginisialisasi Sesi Admin</text>

  <!-- Redirect dashboard -->
  <rect x="440" y="730" width="180" height="50" class="rect-node" />
  <text x="530" y="754" class="text-node">Mengarahkan ke Dashboard</text>
  <text x="530" y="768" class="text-node">Admin (admin/index.php)</text>

  <!-- End Node -->
  <circle cx="530" cy="815" r="10" class="end-node-outer" />
  <circle cx="530" cy="815" r="6" class="end-node-inner" />

  <!-- ================= EDGES & CONNECTIONS ================= -->
  <!-- Start -> Akses -->
  <line x1="170" y1="120" x2="170" y2="150" class="line" marker-end="url(#arrow)" />

  <!-- Akses -> Tampil Form (Cross Lane) -->
  <path d="M 170 200 L 170 215 L 530 215 L 530 230" class="line" marker-end="url(#arrow)" />

  <!-- Tampil Form -> Input (Cross Lane) -->
  <path d="M 530 280 L 530 295 L 170 295 L 170 310" class="line" marker-end="url(#arrow)" />

  <!-- Input -> Klik -->
  <line x1="170" y1="360" x2="170" y2="390" class="line" marker-end="url(#arrow)" />

  <!-- Klik -> Sanitasi (Cross Lane) -->
  <path d="M 170 440 L 170 455 L 530 455 L 530 470" class="line" marker-end="url(#arrow)" />

  <!-- Sanitasi -> Decision -->
  <line x1="530" y1="520" x2="530" y2="550" class="line" marker-end="url(#arrow)" />

  <!-- Decision -> Error [Tidak] -->
  <path d="M 450 590 L 410 590 L 410 415 L 440 415" class="line" marker-end="url(#arrow)" />
  <text x="390" y="580" class="label-edge">Tidak</text>

  <!-- Error -> Tampil Form (Loop back) -->
  <path d="M 530 390 L 530 370 L 640 370 L 640 255 L 620 255" class="line" marker-end="url(#arrow)" />

  <!-- Decision -> Session [Ya] -->
  <line x1="530" y1="630" x2="530" y2="660" class="line" marker-end="url(#arrow)" />
  <text x="545" y="645" class="label-edge">Ya</text>

  <!-- Session -> Redirect -->
  <line x1="530" y1="710" x2="530" y2="730" class="line" marker-end="url(#arrow)" />

  <!-- Redirect -> End -->
  <line x1="530" y1="780" x2="530" y2="805" class="line" marker-end="url(#arrow)" />

</svg>