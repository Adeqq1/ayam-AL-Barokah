<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 580" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', Times, serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .lane-title { font-family: 'Times New Roman', Times, serif; font-size: 14px; font-weight: bold; text-anchor: middle; fill: #000000; }
      .text-node { font-family: 'Times New Roman', Times, serif; font-size: 12px; fill: #000000; text-anchor: middle; }
      .label-edge { font-family: 'Times New Roman', Times, serif; font-size: 11px; fill: #000000; text-anchor: middle; font-style: italic; }
      .line { fill: none; stroke: #000000; stroke-width: 1.5; }
      .rect-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; rx: 8; ry: 8; }
      .diamond-node { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .start-node { fill: #000000; stroke: #000000; stroke-width: 1.5; }
      .end-node-outer { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .end-node-inner { fill: #000000; }
      .border-line { stroke: #000000; stroke-width: 1.5; fill: none; }
      .arrow { fill: #000000; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <!-- Main Background -->
  <rect x="10" y="10" width="720" height="560" fill="#ffffff" stroke="#000000" stroke-width="2" rx="10" ry="10" />

  <!-- Pool Header -->
  <rect x="10" y="10" width="720" height="40" fill="#f0f0f0" stroke="#000000" stroke-width="2" rx="10" ry="10" />
  <rect x="10" y="30" width="720" height="20" fill="#f0f0f0" />
  <line x1="10" y1="50" x2="730" y2="50" stroke="#000000" stroke-width="2" />
  <text x="370" y="34" class="title">Activity Diagram: Logout Admin</text>

  <!-- Swimlane Divider -->
  <line x1="330" y1="50" x2="330" y2="560" class="border-line" />

  <!-- Lane Headers -->
  <rect x="10" y="50" width="320" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <rect x="330" y="50" width="400" height="30" fill="#fafafa" stroke="#000000" stroke-width="1" />
  <text x="170" y="70" class="lane-title">Admin (Aktor)</text>
  <text x="530" y="70" class="lane-title">Sistem (Aplikasi)</text>

  <!-- ================= ADMIN LANE ELEMENTS ================= -->
  <circle cx="170" cy="110" r="10" class="start-node" />
  
  <rect x="80" y="150" width="180" height="50" class="rect-node" />
  <text x="170" y="179" class="text-node">Mengeklik Link Logout pada Sidebar</text>

  <!-- Decision: Yakin? -->
  <polygon points="170,230 240,270 170,310 100,270" class="diamond-node" />
  <text x="170" y="274" class="text-node" style="font-size: 11px;">Apakah Yakin Keluar?</text>

  <!-- Action: Batal (Path A) -->
  <rect x="20" y="360" width="140" height="50" class="rect-node" />
  <text x="90" y="384" class="text-node">Membatalkan Logout</text>
  <text x="90" y="398" class="text-node">(Tetap di Panel Admin)</text>

  <!-- End State: Batal -->
  <circle cx="90" cy="470" r="10" class="end-node-outer" />
  <circle cx="90" cy="470" r="6" class="end-node-inner" />

  <!-- ================= SISTEM LANE ELEMENTS ================= -->
  <rect x="440" y="150" width="180" height="50" class="rect-node" />
  <text x="530" y="179" class="text-node">Menampilkan Dialog Konfirmasi Keluar</text>

  <!-- Action: Hancurkan Sesi (Path B) -->
  <rect x="440" y="360" width="180" height="50" class="rect-node" />
  <text x="530" y="384" class="text-node">Mengosongkan $_SESSION &amp;</text>
  <text x="530" y="398" class="text-node">Menghancurkan Cookie Sesi</text>

  <!-- Action: Redirect index (Path B) -->
  <rect x="440" y="440" width="180" height="50" class="rect-node" />
  <text x="530" y="464" class="text-node">Mengarahkan ke Halaman</text>
  <text x="530" y="478" class="text-node">Katalog Pelanggan (index.php)</text>

  <!-- End State -->
  <circle cx="530" cy="530" r="10" class="end-node-outer" />
  <circle cx="530" cy="530" r="6" class="end-node-inner" />

  <!-- ================= EDGES & CONNECTIONS ================= -->
  <!-- Start -> Akses -->
  <line x1="170" y1="120" x2="170" y2="150" class="line" marker-end="url(#arrow)" />

  <!-- Klik -> Popup (Cross Lane) -->
  <line x1="260" y1="175" x2="440" y2="175" class="line" marker-end="url(#arrow)" />

  <!-- Popup -> Yakin? (Cross Lane) -->
  <path d="M 440 185 L 340 185 L 340 250 L 225 250" class="line" marker-end="url(#arrow)" />

  <!-- Yakin? -> Batal [Tidak] -->
  <path d="M 135 270 L 90 270 L 90 360" class="line" marker-end="url(#arrow)" />
  <text x="100" y="325" class="label-edge">Batal</text>

  <!-- Batal -> End Batal -->
  <line x1="90" y1="410" x2="90" y2="455" class="line" marker-end="url(#arrow)" />

  <!-- Yakin? -> Hancurkan [Yakin] (Cross Lane) -->
  <path d="M 205 270 L 255 270 L 255 340 L 530 340 L 530 360" class="line" marker-end="url(#arrow)" />
  <text x="280" y="325" class="label-edge">Yakin</text>

  <!-- Hancurkan -> Redirect -->
  <line x1="530" y1="410" x2="530" y2="440" class="line" marker-end="url(#arrow)" />

  <!-- Redirect -> End -->
  <line x1="530" y1="490" x2="530" y2="515" class="line" marker-end="url(#arrow)" />

</svg>